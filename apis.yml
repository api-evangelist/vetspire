aid: vetspire
url: https://raw.githubusercontent.com/api-evangelist/vetspire/refs/heads/main/apis.yml
name: Vetspire
kind: company
description: Vetspire is a cloud-based, AI-enabled veterinary practice management (PIMS)
  platform for animal hospitals and clinics, covering electronic medical records,
  scheduling, client communications, billing, inventory, labs, and reminders. Vetspire
  exposes a single public GraphQL API at https://api.vetspire.com/graphql - every
  action in the product is powered by GraphQL - authenticated with an Authorization
  API token and organized by veterinary practice domains (Accounts, Clinical,
  Schedule, Billing, Inventory, Hospital, Lab, Reminders, Conversations, Analytics,
  Events). The schema exposes 400+ object types, 248 input objects, and 112 enums,
  with a maximum query depth of 8.
